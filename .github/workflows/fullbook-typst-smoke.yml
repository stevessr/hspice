name: Verify fullbook Typst layout template

on:
  push:
    branches: [main]
    paths:
      - 'fullbook/**'
      - '.github/workflows/fullbook-typst-smoke.yml'
  pull_request:
    paths:
      - 'fullbook/**'
      - '.github/workflows/fullbook-typst-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.2
      - name: Verify two-page Typst layout without third-party textbook content
        run: |
          typst compile fullbook/SMOKE.typ /tmp/fullbook-smoke.pdf
          test -s /tmp/fullbook-smoke.pdf
          test "$(pdfinfo /tmp/fullbook-smoke.pdf | awk '/^Pages:/ {print $2}')" = "2"
      - name: Verify complete source image references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('fullbook/manifest.json').read_text(encoding='utf-8'))
          assert m['source_pages']==445
          assert len(m['chunks'])==23
          s=Path('fullbook/main.typ').read_text(encoding='utf-8')
          assert s.count('#image(')==445
          assert s.count('#pagebreak()')==444
          print('Complete 445-page mapping verified')
          PY
