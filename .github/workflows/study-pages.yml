name: Deploy VitePress study site

on:
  push:
    branches: [main]
    paths:
      - 'study/midterm/**'
      - '实验*.pdf'
      - 'fullbook/native/web/**'
      - 'fullbook/native/figures/**'
      - 'fullbook/native/page-status.json'
      - 'fullbook/native/tools/fidelity_gate.py'
      - '.github/workflows/study-pages.yml'
      - '.github/workflows/study-typst.yml'
  pull_request:
    paths:
      - 'study/midterm/**'
      - '实验*.pdf'
      - 'fullbook/native/web/**'
      - 'fullbook/native/figures/**'
      - '.github/workflows/study-pages.yml'
  workflow_run:
    workflows: ['Build Typst PDF']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vitepress-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Markdown and VitePress (no Typst)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm and installed dependencies
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            study/midterm/node_modules
          key: vitepress-node22-${{ runner.os }}-${{ hashFiles('study/midterm/package.json') }}

      - name: Validate Markdown and image references
        run: python3 study/midterm/scripts/validate.py

      - name: Install VitePress
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: study/midterm
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Copy original experiment PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p study/midterm/public/experiments
          for f in 实验*.pdf; do
            test -s "$f"
            cp "$f" study/midterm/public/experiments/
          done
          for name in 一 二 三 四 五 六 七 八 九 十; do
            test -s "study/midterm/public/experiments/实验${name}.pdf"
          done

      - name: Restore latest successfully built review PDF (optional)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hspice-pdf-artifact
          # Download a coherent, validated bundle from one successful PDF run.
          # No local PDF compilation occurs during Pages deployment.
          found_bundle=false
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow study-typst.yml --branch main --status success --limit 12 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          for run_id in $runs; do
            rm -rf /tmp/hspice-pdf-artifact/*
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name hspice-study-pdf-bundle --dir /tmp/hspice-pdf-artifact >/dev/null 2>&1; then
              if test -s /tmp/hspice-pdf-artifact/pdf-index.json &&
                 test -s /tmp/hspice-pdf-artifact/midterm-review.pdf &&
                 test -s /tmp/hspice-pdf-artifact/textbook-review.pdf; then
                cp -a /tmp/hspice-pdf-artifact/. study/midterm/public/
                echo "Using split PDF bundle from run $run_id"
                found_bundle=true
                break
              fi
            fi
          done
          if [ "$found_bundle" = false ]; then
            # Backward compatibility with the previous single-PDF artifacts.
            for run_id in $runs; do
              rm -rf /tmp/hspice-pdf-artifact/*
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name hspice-midterm-review --dir /tmp/hspice-pdf-artifact >/dev/null 2>&1; then
                if test -s /tmp/hspice-pdf-artifact/midterm-review.pdf; then
                  cp /tmp/hspice-pdf-artifact/midterm-review.pdf study/midterm/public/
                  echo "Using legacy PDF from run $run_id"
                  break
                fi
              fi
            done
          fi
          if ! test -s study/midterm/public/midterm-review.pdf; then
            echo "::warning::No successful review PDF artifact yet; Markdown Pages will still deploy."
          fi

      - name: Check downloaded chapter PDFs (when available)
        shell: bash
        run: |
          if [ -f study/midterm/public/pdf-index.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('study/midterm/public')
          items = json.loads((root/'pdf-index.json').read_text(encoding='utf-8'))['items']
          for item in items:
              assert (root/item['path']).is_file(), item['path']
          print('Pages PDF preview collection:', len(items), 'files')
          PY
          fi

      - name: Install Typst for editable HTML preview (no PDF)
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.15.0

      - name: Export reviewed native Typst sections to semantic HTML
        run: python3 fullbook/native/web/build_html.py --output study/midterm/public/native-typst

      - name: Verify native Typst HTML and source availability
        shell: bash
        run: |
          set -euo pipefail
          for section in 01-gates-noise-delay 02-mos-threshold 03-page-026; do
            test -s "study/midterm/public/native-typst/${section}.html"
            test -s "study/midterm/public/native-typst/${section}.typ"
            grep -qi '<html' "study/midterm/public/native-typst/${section}.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('study/midterm/public/native-typst')
          data=json.loads((root/'index.json').read_text(encoding='utf-8'))
          assert data['format']=='native-typst-html'
          assert data['accepted_full_pages']==0
          assert len(data['items'])==3
          print('Native Typst HTML previews validated')
          PY

      - name: Publish strict 1-to-1 fidelity status (metadata only)
        run: |
          python3 fullbook/native/tools/fidelity_gate.py \
            --status fullbook/native/page-status.json \
            --json study/midterm/public/native-fidelity.json

      - name: Build VitePress documentation and local search
        working-directory: study/midterm
        run: npm run docs:build

      - name: Check math, figures and native HTML output
        shell: bash
        run: |
          set -euo pipefail
          test -s study/midterm/.vitepress/dist/index.html
          if ! grep -R -l 'mjx-container' study/midterm/.vitepress/dist/content/chapters/ >/dev/null; then
            echo "::error::MathJax output not found in rendered chapters"
            exit 1
          fi
          # Vite may inline SVG files smaller than its asset threshold.
          # Inspect rendered chapter HTML rather than requiring .svg files.
          if ! grep -R -l '元器件与地符号' study/midterm/.vitepress/dist/content/chapters/ >/dev/null; then
            echo "::error::Illustration markup not found in rendered chapters"
            exit 1
          fi
          test -s study/midterm/.vitepress/dist/native-workbench.html
          test -s study/midterm/.vitepress/dist/native-fidelity.json
          test -s study/midterm/.vitepress/dist/native-typst.html
          test -s study/midterm/.vitepress/dist/native-typst/01-gates-noise-delay.html
          test -s study/midterm/.vitepress/dist/native-typst/02-mos-threshold.html
          test -s study/midterm/.vitepress/dist/native-typst/03-page-026.html
          echo "MathJax, SVG, and Typst HTML smoke tests passed"

      - name: Upload site build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hspice-vitepress-site
          path: study/midterm/.vitepress/dist/
          if-no-files-found: error

      - name: Upload GitHub Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: study/midterm/.vitepress/dist/

  deploy:
    name: Publish Markdown and PDF preview to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
