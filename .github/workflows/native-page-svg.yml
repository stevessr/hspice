name: Verify page-sized native Typst SVG (no PDF)
on:
  push:
    branches: [main]
    paths:
      - 'fullbook/native/web/**'
      - 'fullbook/native/figures/**'
      - '.github/workflows/native-page-svg.yml'
  pull_request:
    paths:
      - 'fullbook/native/web/**'
      - 'fullbook/native/figures/**'
      - '.github/workflows/native-page-svg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  svg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.15.0
        continue-on-error: true
      - name: Ensure Typst 0.15.1 via official OCI fallback
        run: bash .github/scripts/ensure-typst.sh 0.15.1
      - name: Install fonts with bounded mirror wait
        timeout-minutes: 4
        run: |
          if timeout 35s sudo apt-get update -qq && timeout 100s sudo apt-get install -y fonts-noto-cjk; then
            echo 'CJK fonts ready'
          else
            echo '::warning::Font mirror timed out; compiling with fallback fonts'
          fi
      - name: Compile every source-sized Typst page
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-pages
          python3 fullbook/native/web/validate_selections.py
          python3 fullbook/native/qa/check_mos_iv.py
          python3 fullbook/native/qa/check_velocity_sat.py
          python3 fullbook/native/qa/check_subthreshold_cap.py
          python3 fullbook/native/qa/check_ch2_finish.py
          python3 fullbook/native/qa/check_ch3_fabrication.py
          python3 fullbook/native/qa/check_ch3_layout_spice.py
          python3 fullbook/native/qa/check_bsim_effects.py
          python3 fullbook/native/qa/check_ch3_summary.py
          python3 fullbook/native/qa/check_ch4_inverter.py
          python3 fullbook/native/qa/check_ch4_mosloads.py
          python3 fullbook/native/qa/check_ch4_cmos_continued.py
          python3 fullbook/native/qa/check_ch4_end.py
          python3 fullbook/native/qa/check_ch5_gates.py
          python3 fullbook/native/qa/check_ch5_complex_sequential.py
          python3 fullbook/native/qa/check_ch5_jk.py
          python3 fullbook/native/qa/check_ch5_dff_power.py
          python3 fullbook/native/qa/check_ch5_end.py
          python3 fullbook/native/qa/check_ch6_delay_cap.py
          python3 fullbook/native/qa/check_ch6_source_pages.py
          python3 fullbook/native/qa/check_ch6_pass4.py
          python3 fullbook/native/qa/check_ch6_pass4_continued.py
          python3 fullbook/native/qa/check_ch6_visual_pass4.py
          python3 fullbook/native/qa/check_ch6_pass5.py
          python3 fullbook/native/qa/check_ch6_visual_pass5.py
          python3 fullbook/native/qa/check_ch6_logical_effort.py
          python3 fullbook/native/qa/check_ch6_logical_visual.py
          python3 fullbook/native/qa/check_ch6_pass7.py
          python3 fullbook/native/qa/check_ch7_pass8.py
          python3 fullbook/native/qa/check_ch7_visual_pass8.py
          python3 fullbook/native/qa/check_ch7_source_rescan.py
          python3 fullbook/native/qa/check_ch7_source_visual_reflow.py
          python3 fullbook/native/qa/check_ch6_visual_pass7.py
          python3 fullbook/native/qa/check_ch6_visual_progress.py
          python3 fullbook/native/qa/check_ch6_spice_sources.py
          python3 fullbook/native/qa/check_status_consistency.py
          python3 fullbook/native/qa/check_ch7_pass9.py
          python3 fullbook/native/qa/check_ch7_visual_pass9.py
          python3 fullbook/native/qa/check_ch7_pass10.py
          python3 fullbook/native/qa/check_ch7_pass11.py
          python3 fullbook/native/qa/check_ch7_pass12.py
          python3 fullbook/native/qa/check_ch8_pass13.py
          python3 fullbook/native/qa/check_ocr_coverage_all.py
          python3 fullbook/native/qa/check_ch9_pass15.py
          python3 fullbook/native/qa/check_ch9_pass16.py
          python3 fullbook/native/qa/check_ch9_pass17.py
          python3 fullbook/native/qa/check_spice_appendix.py
          python3 fullbook/native/qa/check_frontmatter_toc.py
          python3 fullbook/native/qa/check_ch10_pass18.py
          python3 fullbook/native/qa/check_ch10_pass19.py
          python3 fullbook/native/qa/check_ch10_pass20.py
          python3 fullbook/native/qa/check_ch10_pass21.py
          python3 fullbook/native/qa/check_ch11_pass22.py
          python3 fullbook/native/qa/check_ch11_pass23.py
          python3 fullbook/native/qa/check_ch11_pass24.py
          python3 fullbook/native/qa/check_ch11_pass25.py
          python3 fullbook/native/qa/check_ch7_visual_pass10.py
          for source in fullbook/native/web/*-page-*-layout.typ; do
            stem="$(basename "${source%-layout.typ}")"
            dest="/tmp/source-pages/${stem}.svg"
            typst compile --features html --format svg --root fullbook/native "$source" "$dest"
            test -s "$dest"
            grep -q 'viewBox="0 0 506.8346 729.6"' "$dest"
          done
          test "$(find /tmp/source-pages -type f -name '*.svg' | wc -l)" -eq 445

      - name: Publish visual audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst-native-pages-001-445-svg
          path: /tmp/source-pages/
          if-no-files-found: error
