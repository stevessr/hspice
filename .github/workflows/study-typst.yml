name: Build PDF and deploy VitePress study site

on:
  push:
    branches: [main]
    paths:
      - 'study/midterm/**'
      - '实验*.pdf'
      - '.github/workflows/study-typst.yml'
  pull_request:
    paths:
      - 'study/midterm/**'
      - '实验*.pdf'
      - '.github/workflows/study-typst.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hspice-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate source, compile PDF, build VitePress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pandoc and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.0

      - name: Validate Markdown and practice links
        run: python3 study/midterm/scripts/validate.py

      - name: Regenerate all Typst chapters and practice sheets
        run: python3 study/midterm/scripts/sync_typst.py

      - name: Validate generated Typst
        run: python3 study/midterm/scripts/validate.py --generated

      - name: Compile PDF
        run: |
          mkdir -p study/midterm/build
          typst compile study/midterm/main.typ study/midterm/build/midterm-review.pdf

      - name: Upload print-ready PDF
        uses: actions/upload-artifact@v4
        with:
          name: hspice-midterm-review
          path: study/midterm/build/midterm-review.pdf
          if-no-files-found: error

      - name: Prepare PDFs for public VitePress pages
        shell: bash
        run: |
          mkdir -p study/midterm/public/experiments
          cp study/midterm/build/midterm-review.pdf study/midterm/public/midterm-review.pdf
          for file in 实验*.pdf; do
            if [ -f "$file" ]; then
              cp "$file" study/midterm/public/experiments/
            fi
          done
          for name in 一 二 三 四 五 六 七 八 九 十; do
            test -s "study/midterm/public/experiments/实验${name}.pdf"
          done

      - name: Install VitePress dependencies
        working-directory: study/midterm
        run: npm install --no-audit --no-fund

      - name: Build searchable documentation site
        working-directory: study/midterm
        run: npm run docs:build

      - name: Upload website build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hspice-vitepress-site
          path: study/midterm/.vitepress/dist/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: study/midterm/.vitepress/dist/

  deploy:
    name: Publish VitePress to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        uses: actions/deploy-pages@v4
        id: deployment
