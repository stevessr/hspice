name: Build Typst PDF

on:
  push:
    branches: [main]
    paths:
      - 'study/midterm/content/**'
      - 'study/midterm/typst/**'
      - 'study/midterm/assets/figures/**'
      - 'study/midterm/main.typ'
      - 'study/midterm/textbook/**'
      - 'study/midterm/scripts/**'
      - '.github/workflows/study-typst.yml'
  pull_request:
    paths:
      - 'study/midterm/content/**'
      - 'study/midterm/typst/**'
      - 'study/midterm/assets/figures/**'
      - 'study/midterm/main.typ'
      - 'study/midterm/scripts/**'
      - '.github/workflows/study-typst.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hspice-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    name: Validate and compile standalone PDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Markdown source and links
        run: python3 study/midterm/scripts/validate.py

      - name: Restore content-addressed PDF cache
        id: pdf-cache
        uses: actions/cache@v4
        with:
          path: |
            study/midterm/build/midterm-review.pdf
            study/midterm/build/textbook-review.pdf
            study/midterm/build/publish/
          key: midterm-pdf-v4-${{ runner.os }}-${{ hashFiles('study/midterm/content/**/*.md', 'study/midterm/main.typ', 'study/midterm/textbook/**/*.typ', 'study/midterm/scripts/**', 'study/midterm/assets/figures/*.svg') }}

      - name: Cache Typst resources
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst
          key: midterm-typst-resource-v1-${{ runner.os }}-0.14

      - name: Install Pandoc and Chinese fonts
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk librsvg2-bin

      - name: Install Typst
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.0
        continue-on-error: true
      - name: Ensure Typst 0.14.2 via official OCI fallback
        run: bash .github/scripts/ensure-typst.sh 0.14.2

      - name: Rasterize SVG figures for print (VitePress retains SVG)
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: python3 study/midterm/scripts/rasterize_svg.py

      - name: Convert Markdown to Typst
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: python3 study/midterm/scripts/sync_typst.py

      - name: Validate generated Typst
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: python3 study/midterm/scripts/validate.py --generated

      - name: Install PDF merge library
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: python3 -m pip install --user 'pypdf>=5,<7'

      - name: Compile isolated Typst sections and merge PDF
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        timeout-minutes: 18
        run: python3 study/midterm/scripts/build_pdf.py

      - name: Verify both PDFs and the chapter manifest
        run: |
          test -s study/midterm/build/midterm-review.pdf
          test -s study/midterm/build/textbook-review.pdf
          test -s study/midterm/build/publish/pdf-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('study/midterm/build/publish')
          data = json.loads((base/'pdf-index.json').read_text(encoding='utf-8'))
          items = data['items']
          assert len(items) >= 38, len(items)
          for entry in items:
              assert (base/entry['path']).is_file(), entry
          print('Validated', len(items), 'PDF preview entries')
          PY

      - name: Upload complete chapter PDF collection
        uses: actions/upload-artifact@v4
        with:
          name: hspice-study-pdf-bundle
          path: study/midterm/build/publish/
          retention-days: 30
          if-no-files-found: error

      - name: Upload PDF artifact independently of Pages
        uses: actions/upload-artifact@v4
        with:
          name: hspice-midterm-review
          path: study/midterm/build/midterm-review.pdf
          retention-days: 30
          if-no-files-found: error

