name: Build Typst PDF

on:
  push:
    branches: [main]
    paths:
      - 'study/midterm/content/**'
      - 'study/midterm/typst/**'
      - 'study/midterm/assets/figures/**'
      - 'study/midterm/main.typ'
      - 'study/midterm/scripts/**'
      - '.github/workflows/study-typst.yml'
  pull_request:
    paths:
      - 'study/midterm/content/**'
      - 'study/midterm/typst/**'
      - 'study/midterm/assets/figures/**'
      - 'study/midterm/main.typ'
      - 'study/midterm/scripts/**'
      - '.github/workflows/study-typst.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hspice-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    name: Validate and compile standalone PDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Markdown source and links
        run: python3 study/midterm/scripts/validate.py

      - name: Restore content-addressed PDF cache
        id: pdf-cache
        uses: actions/cache@v4
        with:
          path: study/midterm/build/midterm-review.pdf
          key: midterm-pdf-v2-${{ runner.os }}-${{ hashFiles('study/midterm/content/**/*.md', 'study/midterm/main.typ', 'study/midterm/scripts/sync_typst.py', 'study/midterm/assets/figures/*.svg') }}

      - name: Cache Typst resources
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst
          key: midterm-typst-resource-v1-${{ runner.os }}-0.14

      - name: Install Pandoc and Chinese fonts
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Install Typst
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.0

      - name: Convert Markdown to Typst
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: python3 study/midterm/scripts/sync_typst.py

      - name: Validate generated Typst
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: python3 study/midterm/scripts/validate.py --generated

      - name: Compile PDF (bounded)
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          mkdir -p study/midterm/build
          typst compile study/midterm/main.typ study/midterm/build/midterm-review.pdf

      - name: Confirm PDF exists
        run: test -s study/midterm/build/midterm-review.pdf

      - name: Upload PDF artifact independently of Pages
        uses: actions/upload-artifact@v4
        with:
          name: hspice-midterm-review
          path: study/midterm/build/midterm-review.pdf
          retention-days: 30
          if-no-files-found: error
