name: Verify native editable Typst layout

on:
  push:
    branches: [main]
    paths:
      - 'fullbook/native/**'
      - '.github/workflows/fullbook-native-typst.yml'
  pull_request:
    paths:
      - 'fullbook/native/**'
      - '.github/workflows/fullbook-native-typst.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # This smoke test checks Typst syntax, not production font metrics.
      # Font installation is tested separately by the PDF publishing workflow.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.2
        continue-on-error: true
      - name: Ensure Typst 0.14.2 via official OCI fallback
        run: bash .github/scripts/ensure-typst.sh 0.14.2
      - name: Audit chapter 1 opening editorial sources
        run: python3 fullbook/native/qa/check_ch1_opening.py
      - name: Verify math and truth-table syntax from latest proofreading round
        run: |
          typst compile fullbook/native/fixtures/proofread-syntax.typ /tmp/proofread-syntax.pdf
          test -s /tmp/proofread-syntax.pdf
      - name: Try installing CJK fonts with bounded mirror wait
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if timeout 35s sudo apt-get update -qq && timeout 85s sudo apt-get install -y --no-install-recommends fonts-noto-cjk; then
            echo "Noto CJK fonts installed"
          else
            echo "::warning::Ubuntu font mirror timed out; compiling with Typst fallback fonts"
          fi
      - name: Validate source page map
        run: python3 fullbook/native/validate.py
      - name: Compile native editable math, table and diagram
        run: |
          typst compile fullbook/native/template.typ /tmp/fullbook-native-smoke.pdf
          test -s /tmp/fullbook-native-smoke.pdf
          test -s /tmp/fullbook-native-smoke.pdf
      - name: Compile partially transcribed native chapter preview
        run: |
          mkdir -p /tmp/native-editable
          typst compile --root fullbook/native fullbook/native/editorial/main.typ /tmp/native-editable/editorial-preview.pdf
          test -s /tmp/native-editable/editorial-preview.pdf
      - name: Upload editable chapter PDF preview
        uses: actions/upload-artifact@v4
        with:
          name: fullbook-native-editorial-preview
          path: /tmp/native-editable/editorial-preview.pdf
          retention-days: 14
          if-no-files-found: error
      - name: Check source does not embed scanned pages
        run: |
          if grep -R -E '#image\(.*page-[0-9]{3}' fullbook/native --include='*.typ'; then
            echo "::error::Source page images must not be embedded in native transcription."
            exit 1
          fi
