<text x="305" y="111" class="label" text-anchor="middle">F</text>
<rect x="845" y="145" width="130" height="215" fill="#d8d8d8" stroke="#222" stroke-width="2"/>
<rect x="810" y="224" width="200" height="75" fill="#aaa" stroke="#222" stroke-width="2"/>
<path d="M775 261 H810 M910 145 V114 M910 360 V392 M882 392 H938 M890 403 H930 M899 414 H921" stroke="#111" stroke-width="2.4" fill="none"/>
<text x="756" y="268" class="label" text-anchor="end">G</text>
<text x="910" y="111" class="label" text-anchor="middle">F</text>
<text x="910" y="137" class="label" text-anchor="middle">3Wₙ</text>
<text x="1015" y="264" class="label" >3Lₙ</text>
<text x="305" y="446" class="caption" text-anchor="middle">三段多晶硅栅横跨同一扩散区</text>
<text x="910" y="446" class="caption" text-anchor="middle">等效沟道长度为三倍，宽度保持不变</text>
<text x="600" y="482" class="note" text-anchor="middle">归一化一阶近似：Wₑq = 3Wₙ / 3 = Wₙ（同一导通电流条件）</text>
