<rect x="205" y="245" width="200" height="25" fill="#aaa" stroke="#222" stroke-width="2"/>
<rect x="205" y="306" width="200" height="25" fill="#aaa" stroke="#222" stroke-width="2"/>
<path d="M170 196 H205" stroke="#111" stroke-width="2.4"/><text x="151" y="202" class="label" text-anchor="end">A</text>
<path d="M170 257 H205" stroke="#111" stroke-width="2.4"/><text x="151" y="263" class="label" text-anchor="end">B</text>
<path d="M170 318 H205" stroke="#111" stroke-width="2.4"/><text x="151" y="324" class="label" text-anchor="end">C</text>
<text x="305" y="137" class="label" text-anchor="middle">3Wₙ</text>
<text x="417" y="200" class="label" >Lₙ</text>
<text x="417" y="260" class="label" >Lₙ</text>
<text x="417" y="321" class="label" >Lₙ</text>
