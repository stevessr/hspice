<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-labelledby="title desc">
<title id="title">教材图5.4 三 NMOS 串联版图和等效沟道</title>
<desc id="desc">左图连续有源扩散区域上交叉三根多晶硅栅 A、B、C，每根栅对应沟道长度 Ln，晶体管沟道宽度为 3Wn；右图是一根等效栅，沟道长度为 3Ln，宽度仍为 3Wn。</desc>
<style>.head{font:700 24px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1d1d1d}.title{font:700 20px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}.label{font:19px Georgia,"Noto Serif CJK SC",serif}.caption{font:17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#444}.note{font:18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#333}</style>
<rect width="1200" height="510" fill="white"/>
<text x="600" y="42" class="head" text-anchor="middle">三只串联 NMOS 的版图与等效沟道（教材图 5.4）</text>
<text x="300" y="95" class="title" text-anchor="middle">(a) 三管串联：每管 3Wₙ / Lₙ</text>
<text x="910" y="95" class="title" text-anchor="middle">(b) 一只等效管：3Wₙ / 3Lₙ</text>
<path d="M600 70 V414" stroke="#aaa" stroke-width="1.5"/>
<rect x="240" y="145" width="130" height="215" fill="#d8d8d8" stroke="#222" stroke-width="2"/>
