<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="ttl desc">
<title id="ttl">NMOS 与 PMOS 四端电路符号（教材图 2.1、图 2.2）</title>
<desc id="desc">NMOS 漏极 D 在上、源极 S 在下、栅极 G 在左且没有圆圈、体端 B 在右；PMOS 源极 S 在上、漏极 D 在下、栅极 G 有圆圈、体端 B 在右。</desc>
<style>
  .wire{fill:none;stroke:#171717;stroke-width:2.8;stroke-linecap:square;stroke-linejoin:miter}
  .node{fill:#171717}
  .label{fill:#171717;font:19px Georgia,"Noto Serif CJK SC",serif}
  .head{fill:#171717;font:bold 23px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  .caption{fill:#333;font:16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}
</style>
<rect width="960" height="410" fill="white"/>
<defs>
  <g id="nmos4" class="wire">
    <path d="M0 -26 V26 M-25 -26 V26 M-70 0 H-25 M0 -56 V-26 M0 26 V56 M0 0 H70"/>
  </g>
  <g id="pmos4" class="wire">
    <path d="M0 -26 V26 M-25 -26 V26 M-70 0 H-39 M0 -56 V-26 M0 26 V56 M0 0 H70"/>
    <circle cx="-32" cy="0" r="7" fill="white"/>
  </g>
</defs>
<text x="480" y="43" text-anchor="middle" class="head">MOS 晶体管的四端电路符号</text>
<g id="nmos" data-device="nmos4">
  <text x="252" y="102" text-anchor="middle" class="head">NMOS</text>
  <use xlink:href="#nmos4" href="#nmos4" x="252" y="209"/>
  <circle class="node" cx="252" cy="153" r="4"/><circle class="node" cx="252" cy="265" r="4"/>
  <circle class="node" cx="182" cy="209" r="4"/><circle class="node" cx="322" cy="209" r="4"/>
  <text x="252" y="141" text-anchor="middle" class="label">D</text>
  <text x="252" y="296" text-anchor="middle" class="label">S</text>
  <text x="164" y="216" text-anchor="end" class="label">G</text>
  <text x="340" y="216" class="label">B</text>
  <text x="252" y="332" text-anchor="middle" class="caption">n 沟道 · 栅极无反相圆圈</text>
</g>
<g id="pmos" data-device="pmos4">
  <text x="701" y="102" text-anchor="middle" class="head">PMOS</text>
  <use xlink:href="#pmos4" href="#pmos4" x="701" y="209"/>
  <circle class="node" cx="701" cy="153" r="4"/><circle class="node" cx="701" cy="265" r="4"/>
  <circle class="node" cx="631" cy="209" r="4"/><circle class="node" cx="771" cy="209" r="4"/>
  <text x="701" y="141" text-anchor="middle" class="label">S</text>
  <text x="701" y="296" text-anchor="middle" class="label">D</text>
  <text x="613" y="216" text-anchor="end" class="label">G</text>
  <text x="789" y="216" class="label">B</text>
  <text x="701" y="332" text-anchor="middle" class="caption">p 沟道 · 栅极有反相圆圈</text>
</g>
<text x="480" y="376" text-anchor="middle" class="caption">按教材图 2.1、图 2.2 重绘。G：栅极；D：漏极；S：源极；B：体端 / 衬底。</text>
</svg>
