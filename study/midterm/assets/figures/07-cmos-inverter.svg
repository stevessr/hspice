<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" width="960" height="382" role="img" aria-label="CMOS 反相器连接关系"><title>CMOS 反相器连接关系</title><style>text{font:17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#26374a}.title{font-size:24px;font-weight:700;fill:#185c83}.note{font-size:14px;fill:#516477}.w{stroke:#304355;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.d{fill:#e8f3fa;stroke:#25739c;stroke-width:2.5}.dot{fill:#304355}</style><rect x="1" y="1" width="958" height="380" rx="14" fill="#fff" stroke="#cdd9e3"/><text x="480" y="38" text-anchor="middle" class="title">CMOS 反相器连接关系</text><rect class="d" x="355" y="88" width="170" height="62" rx="8"/><text x="440" y="125" text-anchor="middle">PMOS</text><rect class="d" x="355" y="223" width="170" height="62" rx="8"/><text x="440" y="260" text-anchor="middle">NMOS</text><path class="w" d="M440 65 L440 88"/><text x="440" y="56" text-anchor="middle">VDD</text><path class="w" d="M440 150 L440 190"/><circle class="dot" cx="440" cy="190" r="4"/><path class="w" d="M440 190 L440 223"/><path class="w" d="M440 285 L440 311"/><path class="w" d="M411 311 L469 311"/><path class="w" d="M420 322 L460 322"/><path class="w" d="M429 333 L451 333"/><path class="w" d="M204 119 H355 M204 119 V254 H355"/><text x="155" y="188" >Vin</text><path class="w" d="M440 190 L610 190"/><text x="621" y="195" >Vout</text><text x="541" y="119" class="note">体端 → VDD</text><text x="541" y="254" class="note">体端 → GND</text><text x="790" y="119" text-anchor="middle">Vin 低：上拉导通</text><text x="790" y="157" text-anchor="middle">Vin 高：下拉导通</text><text x="480" y="363" class="note" text-anchor="middle">输入共同驱动两个栅端；输出位于互补上拉与下拉路径的连接点。</text></svg>