<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="主从 JK 触发器的级联组成"><title>主从 JK 触发器的级联组成</title><style>text{font:17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#26374a}.title{font-size:24px;font-weight:700;fill:#185c83}.note{font-size:14px;fill:#516477}.w{stroke:#304355;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.d{fill:#e8f3fa;stroke:#25739c;stroke-width:2.5}.dot{fill:#304355}</style><rect x="1" y="1" width="958" height="378" rx="14" fill="#fff" stroke="#cdd9e3"/><text x="480" y="38" text-anchor="middle" class="title">主从 JK 触发器的级联组成</text><rect class="d" x="157" y="122" width="234" height="105" rx="8"/><text x="274" y="180.5" text-anchor="middle">主锁存器</text><rect class="d" x="549" y="122" width="234" height="105" rx="8"/><text x="666" y="180.5" text-anchor="middle">从锁存器</text><path class="w" d="M68 151 L157 151"/><text x="46" y="156" >J</text><path class="w" d="M68 198 L157 198"/><text x="46" y="204" >K</text><path class="w" d="M391 175 L549 175"/><text x="470" y="158" text-anchor="middle">主级状态</text><path class="w" d="M783 175 L882 175"/><text x="891" y="181" >Q</text><path class="w" d="M274 295 L274 227"/><path class="w" d="M666 295 L666 227"/><text x="274" y="317" text-anchor="middle">CK</text><text x="666" y="317" text-anchor="middle">CK̅</text><text x="480" y="360" class="note" text-anchor="middle">主级与从级使用互补时钟；外部输出在时钟切换后的更新取决于具体电路连接。</text></svg>