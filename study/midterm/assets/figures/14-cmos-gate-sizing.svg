<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1700 745" width="1700" height="745" role="img" aria-labelledby="title desc">
<title id="title">教材图5.2：CMOS 反相器、NAND2 和 NOR2 的晶体管尺寸</title>
<desc id="desc">三组真实 MOS 晶体管级电路，依次是反相器 PMOS 2W、NMOS W；NAND2 两 PMOS 2W 并联、两 NMOS 2W 串联；NOR2 两 PMOS 4W 串联、两 NMOS W 并联。输出均具有接地电容 CL。</desc>
<style>.wire{stroke:#1d1d1d;stroke-width:2.7;stroke-linejoin:miter;stroke-linecap:square;fill:none}.junction{fill:#1d1d1d}.head{font:700 27px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}.section{font:700 22px "Noto Sans CJK SC","Microsoft YaHei",sans-serif}.pin{font:20px Georgia,"Noto Serif CJK SC",serif}.size{font:italic 21px Georgia,"Noto Serif CJK SC",serif}.note{font:17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#444}#grid-line{stroke:#bbb;stroke-width:1}</style>
<rect width="1700" height="745" fill="white"/>
<defs>
<g id="nmos3" class="wire"><path d="M0 -25 V25 M-25 -25 V25 M-70 0 H-25 M0 -56 V-25 M0 25 V56"/></g>
<g id="pmos3" class="wire"><path d="M0 -25 V25 M-25 -25 V25 M-70 0 H-39 M0 -56 V-25 M0 25 V56"/><circle cx="-32" cy="0" r="7" fill="white"/></g>
</defs>
<text class="head" x="850" y="46" text-anchor="middle">图 5.2 · 静态 CMOS 门的晶体管尺寸</text>
<path class="wire" d="M555 105 V678 M1120 105 V678" id="grid-line"/>
<text class="section" x="270" y="102" text-anchor="middle">(a) CMOS 反相器</text>
<text class="section" x="820" y="102" text-anchor="middle">(b) NAND2 与非门</text>
<text class="section" x="1410" y="102" text-anchor="middle">(c) NOR2 或非门</text>
<text class="pin" x="260" y="138" text-anchor="middle">VDD</text>
<path class="wire" d="M260 145 V149" id="inv-vdd" data-net="VDD"/>
<g id="inv-pmos" data-device="pmos3" data-gate="A" data-input="A" data-source="VDD" data-drain="INV_Y" data-body="VDD" data-size="2W"><use href="#pmos3" xlink:href="#pmos3" x="260" y="205"/></g><text class="size" x="287" y="211" >2W</text><text class="pin" x="168" y="212" >A</text>
<path class="wire" d="M260 261 V389 M260 327 H450" id="inv-output" data-net="INV_Y"/>
