<g class="wire" data-component="capacitor" data-net="Y"><path d="M1576 428 V514 M1551 514 H1601 M1551 530 H1601 M1576 530 V618"/><path d="M1551 618 H1601 M1559 628 H1593 M1567 638 H1585"/></g><text class="pin" x="1610" y="534" >C<tspan baseline-shift='sub' font-size='15'>L</tspan></text>
