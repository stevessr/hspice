<g id="nor-nmos-b" data-device="nmos3" data-gate="B" data-input="B" data-source="GND" data-drain="NOR_Y" data-body="GND" data-size="W"><use href="#nmos3" xlink:href="#nmos3" x="1490" y="510"/></g><text class="size" x="1517" y="516" >W</text><text class="pin" x="1398" y="517" >B</text>
