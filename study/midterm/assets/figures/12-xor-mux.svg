<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 369" width="960" height="369" role="img" aria-label="XOR 与二选一数据选择器"><title>XOR 与二选一数据选择器</title><style>text{font:17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#26374a}.title{font-size:24px;font-weight:700;fill:#185c83}.note{font-size:14px;fill:#516477}.w{stroke:#304355;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.d{fill:#e8f3fa;stroke:#25739c;stroke-width:2.5}.dot{fill:#304355}</style><rect x="1" y="1" width="958" height="367" rx="14" fill="#fff" stroke="#cdd9e3"/><text x="480" y="38" text-anchor="middle" class="title">XOR 与二选一数据选择器</text><rect class="d" x="139" y="116" width="244" height="110" rx="8"/><text x="261" y="177" text-anchor="middle">XOR</text><path class="w" d="M54 144 L139 144"/><path class="w" d="M54 199 L139 199"/><text x="31" y="149" >A</text><text x="31" y="204" >B</text><path class="w" d="M383 171 L466 171"/><text x="478" y="178" >F = A ⊕ B</text><rect class="d" x="602" y="116" width="207" height="110" rx="8"/><text x="705.5" y="177" text-anchor="middle">MUX 2:1</text><path class="w" d="M518 145 L602 145"/><path class="w" d="M518 198 L602 198"/><text x="495" y="150" >A</text><text x="495" y="204" >B</text><path class="w" d="M705 277 L705 226"/><text x="697" y="301" >S</text><path class="w" d="M809 171 L880 171"/><text x="890" y="178" >F</text><text x="700" y="348" class="note" text-anchor="middle">F = A·S + B·S̅，约定 S=1 选择 A。</text></svg>